
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Solution Agent ID Card</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#eef2f7;font-family:Arial,sans-serif;color:#172033}
.wrap{max-width:500px;margin:auto}
.panel{background:white;padding:18px;border-radius:12px;margin-bottom:15px}
input,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{background:#123b70;color:white;border:0;font-weight:bold}
#card{display:none;background:white;border:2px solid #123b70;border-radius:14px;overflow:hidden;margin:15px auto;max-width:420px}
.head{background:#123b70;color:white;text-align:center;padding:17px 8px}
.head h2{margin:0;font-size:19px}
.head p{margin:6px 0 0;font-size:12px}
.body{padding:18px}
.photo{width:105px;height:115px;border:2px solid #123b70;border-radius:8px;object-fit:cover;background:#eee}
.info{display:flex;gap:15px;align-items:center}
.details{font-size:14px;line-height:1.8;overflow-wrap:anywhere}
.details b{color:#123b70}
.footer{background:#eaf1fa;text-align:center;padding:12px;font-size:12px}
.msg{color:#b42318}
@media print{
body{background:white;padding:0}
.no-print{display:none!important}
#card{display:block!important;margin:20px auto;break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">

<div class="panel no-print" id="loginBox">
<h2>Agent ID Card Login</h2>
<p>अपने Agent Email और Password से Login करें।</p>
<form id="loginForm">
<input id="email" type="email" placeholder="Agent Email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p class="msg" id="msg"></p>
</div>

<div class="panel no-print" id="photoBox" style="display:none">
<h3>अपनी फोटो लगाएँ</h3>
<input type="file" id="photoInput" accept="image/*">
<button id="printBtn">Download / Print ID Card</button>
<button id="logoutBtn">Logout</button>
</div>

<div id="card">
<div class="head">
<h2>MONEY SOLUTION</h2>
<p>FINANCE SERVICES</p>
<p>OFFICIAL AGENT ID CARD</p>
</div>
<div class="body">
<div class="info">
<img id="photo" class="photo" alt="Agent Photo">
<div class="details">
<div><b>नाम:</b> <span id="name"></span></div>
<div><b>Agent ID:</b> <span id="agentId"></span></div>
<div><b>मोबाइल:</b> <span id="mobile"></span></div>
<div><b>जिला:</b> <span id="district"></span></div>
<div><b>Status:</b> APPROVED</div>
</div>
</div>
<hr>
<div class="details">
<b>पता:</b> <span id="address"></span>
</div>
</div>
<div class="footer">
Money Solution Finance Services<br>
Official Agent Identity Card
</div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyClTK1ZFegP_VMs0CO2n2ccyv5oWPqb2xo",
authDomain:"money-salutations-fainence.firebaseapp.com",
projectId:"money-salutations-fainence",
storageBucket:"money-salutations-fainence.firebasestorage.app",
messagingSenderId:"891890606664",
appId:"1:891890606664:web:1d6df6ec8554d523176e7d",
measurementId:"G-HX6NBT529M"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();
const $=id=>document.getElementById(id);

$("loginForm").onsubmit=async e=>{
e.preventDefault();
$("msg").textContent="Login हो रहा है...";
try{
await auth.signInWithEmailAndPassword(
$("email").value.trim(),
$("password").value
);
}catch(err){
$("msg").textContent="Login Error: "+err.message;
}
};

auth.onAuthStateChanged(async user=>{
if(!user){
$("loginBox").style.display="block";
$("photoBox").style.display="none";
$("card").style.display="none";
return;
}
try{
const doc=await db.collection("agents").doc(user.uid).get();
if(!doc.exists)throw new Error("Agent Profile नहीं मिला।");

const a=doc.data();

if(a.status!=="approved"||!a.agentId){
throw new Error("Agent Account Approved नहीं है या Agent ID जारी नहीं हुई है।");
}

$("name").textContent=a.name||"-";
$("agentId").textContent=a.agentId;
$("mobile").textContent=a.mobile||"-";
$("district").textContent=a.district||"-";
$("address").textContent=a.address||"-";
$("photo").src=a.photoData||"";
$("card").style.display="block";
$("loginBox").style.display="none";
$("photoBox").style.display="block";

}catch(err){
$("msg").textContent=err.message;
$("loginBox").style.display="block";
$("photoBox").style.display="none";
$("card").style.display="none";
}
});

async function compressPhoto(file){
if(!file.type.startsWith("image/")) throw new Error("कृपया सही फोटो चुनें।");
if(file.size>8*1024*1024) throw new Error("फोटो 8 MB से छोटी होनी चाहिए।");
const bitmap=await createImageBitmap(file);
let width=bitmap.width, height=bitmap.height;
const scale=Math.min(1,640/Math.max(width,height));
width=Math.round(width*scale); height=Math.round(height*scale);
const canvas=document.createElement("canvas");
canvas.width=width; canvas.height=height;
canvas.getContext("2d").drawImage(bitmap,0,0,width,height);
bitmap.close();
for(const quality of [0.72,0.62,0.52,0.42,0.32]){
const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",quality));
if(blob && blob.size<=250*1024){
return await new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.onerror=()=>reject(new Error("फोटो पढ़ी नहीं जा सकी।"));
reader.readAsDataURL(blob);
});
}
}
throw new Error("फोटो का आकार कम नहीं हुआ। कृपया छोटी फोटो चुनें।");
}

$("photoInput").onchange=async e=>{
const file=e.target.files[0];
if(!file)return;
const input=e.target;
input.disabled=true;
try{
const photoData=await compressPhoto(file);
const user=auth.currentUser;
if(!user) throw new Error("पहले Login करें।");
await db.collection("agents").doc(user.uid).update({
photoData,
photoUpdatedAt:firebase.firestore.FieldValue.serverTimestamp()
});
$("photo").src=photoData;
alert("आपकी फोटो सुरक्षित सेव हो गई है। अगली बार Login करने पर भी दिखेगी।");
}catch(err){
alert("फोटो सेव नहीं हुई: "+err.message);
}finally{
input.disabled=false;
input.value="";
}
};

$("printBtn").onclick=()=>window.print();
$("logoutBtn").onclick=()=>auth.signOut();
</script>
</body>
</html>
