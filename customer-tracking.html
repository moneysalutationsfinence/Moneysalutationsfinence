

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan Tracking - Money Solution Finance Services</title>
<style>
body{font-family:Arial;background:#eef2f7;margin:0;padding:15px}
.box{max-width:500px;margin:25px auto;background:white;padding:20px;border-radius:12px;box-shadow:0 2px 10px #bbb}
h2{text-align:center;color:#123d75}
input,button{width:100%;padding:13px;margin:9px 0;box-sizing:border-box;border-radius:6px}
input{border:1px solid #bbb}
button{background:#123d75;color:white;border:0;font-size:16px}
.card{border:1px solid #ddd;border-radius:8px;padding:12px;margin-top:12px}
#message{color:#b42318;text-align:center}
</style>
</head>
<body>
<div class="box">
<h2>Money Solution Finance Services</h2>
<h3>Customer Loan Tracking</h3>

<input id="mobile" type="tel" maxlength="10"
placeholder="अपना 10 अंकों का मोबाइल नंबर">

<button id="sendOtp">Send OTP</button>

<div id="otpSection" style="display:none">
<input id="otp" type="text" maxlength="6"
placeholder="Enter OTP">
<button id="verifyOtp">Verify OTP</button>
</div>

<div id="recaptcha-container"></div>
<p id="message"></p>
<div id="results"></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth,
 RecaptchaVerifier,
 signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getFirestore,
 collection,
 query,
 where,
 getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyClTK1ZFegP_VMs0CO2n2ccyv5oWPqb2xo",
 authDomain:"money-salutations-fainence.firebaseapp.com",
 projectId:"money-salutations-fainence",
 storageBucket:"money-salutations-fainence.firebasestorage.app",
 messagingSenderId:"891890606664",
 appId:"1:891890606664:web:1d6df6ec8554d523176e7d",
 measurementId:"G-HX6NBT529M"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let confirmationResult=null;
let recaptchaVerifier=null;

const message=document.getElementById("message");

document.getElementById("sendOtp").onclick=async()=>{
 const mobile=document.getElementById("mobile").value.trim();

 if(!/^[0-9]{10}$/.test(mobile)){
  message.textContent="सही 10 अंकों का मोबाइल नंबर डालें।";
  return;
 }

 try{
  message.textContent="OTP भेजा जा रहा है...";

  if(!recaptchaVerifier){
   recaptchaVerifier=new RecaptchaVerifier(
    auth,"recaptcha-container",{size:"normal"}
   );
  }

  await recaptchaVerifier.render();

  confirmationResult=await signInWithPhoneNumber(
   auth,"+91"+mobile,recaptchaVerifier
  );

  document.getElementById("otpSection").style.display="block";
  message.textContent="OTP भेज दिया गया है।";

 }catch(e){
  message.textContent="Error: "+e.message;
 }
};

document.getElementById("verifyOtp").onclick=async()=>{
 const otp=document.getElementById("otp").value.trim();

 if(!confirmationResult){
  message.textContent="पहले OTP भेजें।";
  return;
 }

 try{
  message.textContent="OTP सत्यापित हो रहा है...";
  await confirmationResult.confirm(otp);

  message.textContent="सत्यापन सफल! आपका आवेदन खोज रहे हैं...";
  await loadApplication();

 }catch(e){
  message.textContent="OTP गलत है या समय समाप्त हो गया है।";
 }
};

async function loadApplication(){
 const mobile=auth.currentUser.phoneNumber.replace("+91","");

 try{
  const q=query(
   collection(db,"leads"),
   where("mobile","==",mobile)
  );

  const result=await getDocs(q);
  const area=document.getElementById("results");
  area.innerHTML="";

  if(result.empty){
   area.textContent="इस मोबाइल नंबर से कोई आवेदन नहीं मिला।";
   return;
  }

  const labels={
   pending:"आवेदन प्राप्त",
   processing:"प्रक्रिया में",
   approved:"लोन स्वीकृत",
   rejected:"आवेदन अस्वीकृत",
   disbursed:"लोन जारी"
  };

  result.forEach(item=>{
   const d=item.data();
   const card=document.createElement("div");
   card.className="card";

   const heading=document.createElement("h3");
   heading.textContent=d.customerName||"Customer";

   const details=document.createElement("p");
   details.textContent="Loan Type: "+(d.loanType||"-");

   const amount=document.createElement("p");
   amount.textContent="Loan Amount: ₹"+(d.loanAmount||0);

   const status=document.createElement("h3");
   status.textContent="Status: "+
    (labels[d.status]||d.status||"आवेदन प्राप्त");

   card.append(heading,details,amount,status);
   area.appendChild(card);
  });

 }catch(e){
  message.textContent="Application Error: "+e.message;
 }
}
</script>
</body>
</html>
