
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Login - Money Solution Finance Services</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;padding:20px}
.box{max-width:500px;margin:35px auto;background:white;padding:22px;border-radius:12px;box-shadow:0 2px 12px #bbb}
h2{text-align:center;color:#123d75}
input,button{width:100%;padding:13px;margin:9px 0;box-sizing:border-box;border-radius:6px}
input{border:1px solid #bbb}
button{background:#123d75;color:white;border:0;font-size:16px}
.logout{background:#b42318}
#dashboard{display:none}
#message{text-align:center;color:#b42318}
</style>
</head>
<body>

<div class="box" id="loginBox">
<h2>Agent Login</h2>
<p style="text-align:center">Money Solution Finance Services</p>
<input type="email" id="email" placeholder="Registered Email">
<input type="password" id="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="message"></p>
</div>

<div class="box" id="dashboard">
<h2>Agent Dashboard</h2>
<p id="welcome"></p>
<hr>
<p><b>Agent Name:</b> <span id="agentName"></span></p>
<p><b>Mobile:</b> <span id="agentMobile"></span></p>
<p><b>District:</b> <span id="agentDistrict"></span></p>
<p><b>Status:</b> <span id="agentStatus"></span></p>
<hr>
<p>आपका Agent Dashboard चालू है।</p>
<p>Customer Leads और Commission की सुविधा अगला चरण में जोड़ी जाएगी।</p>
<button class="logout" id="logoutBtn">Logout</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
 getFirestore, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyClTK1ZFegP_VMs0CO2n2ccyv5oWPqb2xo",
 authDomain: "money-salutations-fainence.firebaseapp.com",
 projectId: "money-salutations-fainence",
 storageBucket: "money-salutations-fainence.firebasestorage.app",
 messagingSenderId: "891890606664",
 appId: "1:891890606664:web:1d6df6ec8554d523176e7d",
 measurementId: "G-HX6NBT529M"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");

async function showAgent(user) {
  loginBox.style.display = "none";
  dashboard.style.display = "block";

  try {
    const snap = await getDoc(doc(db, "agents", user.uid));

    if (!snap.exists()) {
      message.textContent = "Agent profile नहीं मिला।";
      dashboard.style.display = "none";
      loginBox.style.display = "block";
      await signOut(auth);
      return;
    }

    const data = snap.data();

    if (data.status !== "approved") {
      dashboard.style.display = "none";
      loginBox.style.display = "block";
      message.textContent = data.status === "pending"
        ? "आपका आवेदन अभी Admin Approval के लिए Pending है।"
        : "आपका आवेदन Approved नहीं है। Admin से संपर्क करें।";
      await signOut(auth);
      return;
    }

    document.getElementById("welcome").textContent =
      "स्वागत है, " + (data.name || "Agent");
    document.getElementById("agentName").textContent = data.name || "-";
    document.getElementById("agentMobile").textContent = data.mobile || "-";
    document.getElementById("agentDistrict").textContent = data.district || "-";
    document.getElementById("agentStatus").textContent = "Approved";

  } catch (error) {
    dashboard.style.display = "none";
    loginBox.style.display = "block";
    message.textContent = "Profile खुलने में समस्या: " + error.message;
  }
}

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    message.textContent = "Email और Password भरें।";
    return;
  }

  message.textContent = "Login हो रहा है...";
  try {
    const result = await signInWithEmailAndPassword(auth, email, password);
    await showAgent(result.user);
  } catch (error) {
    message.textContent = "Login नहीं हुआ: Email या Password जाँचें।";
  }
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  dashboard.style.display = "none";
  loginBox.style.display = "block";
  message.textContent = "आप Logout हो गए हैं।";
});

onAuthStateChanged(auth, (user) => {
  if (user) showAgent(user);
});
</script>
</body>
</html>
