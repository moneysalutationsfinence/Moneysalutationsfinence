
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Dashboard - Money Solution Finance Services</title>
<style>
body{font-family:Arial;background:#eef2f7;margin:0;padding:15px}
.box{max-width:600px;margin:20px auto;background:white;padding:18px;border-radius:12px;box-shadow:0 2px 10px #bbb}
h2{text-align:center;color:#123d75}
input,select,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;border-radius:6px}
input,select{border:1px solid #bbb}
button{background:#123d75;color:white;border:0;font-size:16px}
.logout{background:#b42318}
.lead{border:1px solid #ccc;padding:12px;margin:10px 0;border-radius:8px}
#dashboard{display:none}
#message{text-align:center;color:#b42318}
</style>
</head>
<body>

<div class="box" id="loginBox">
<h2>Agent Login</h2>
<p style="text-align:center">Money Solution Finance Services</p>
<input type="email" id="email" placeholder="Registered Email">
<input type="password" id="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="message"></p>
</div>

<div class="box" id="dashboard">
<h2>Agent Dashboard</h2>
<p id="welcome"></p>
<p><b>Mobile:</b> <span id="agentMobile"></span></p>
<p><b>Status:</b> Approved</p>

<hr>
<h2>Add Customer Loan Inquiry</h2>
<input id="customerName" placeholder="Customer Full Name">
<input id="customerMobile" placeholder="Customer Mobile Number" maxlength="10">
<select id="loanType">
<option value="">Select Loan Type</option>
<option>Personal Loan</option>
<option>Business Loan</option>
<option>Home Loan</option>
<option>Loan Against Property</option>
<option>Construction Loan</option>
<option>Other Loan</option>
</select>
<input id="loanAmount" type="number" placeholder="Loan Amount">
<button id="addLeadBtn">Submit Customer Lead</button>
<p id="leadMessage"></p>

<hr>
<h2>My Customer Leads</h2>
<button id="refreshBtn">Refresh Leads</button>
<div id="myLeads">Loading...</div>

<button class="logout" id="logoutBtn">Logout</button>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
 getFirestore,doc,getDoc,collection,addDoc,
 query,where,getDocs,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyClTK1ZFegP_VMs0CO2n2ccyv5oWPqb2xo",
 authDomain:"money-salutations-fainence.firebaseapp.com",
 projectId:"money-salutations-fainence",
 storageBucket:"money-salutations-fainence.firebasestorage.app",
 messagingSenderId:"891890606664",
 appId:"1:891890606664:web:1d6df6ec8554d523176e7d",
 measurementId:"G-HX6NBT529M"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
let currentAgent=null;

const loginBox=document.getElementById("loginBox");
const dashboard=document.getElementById("dashboard");
const message=document.getElementById("message");

async function openDashboard(user){
 try{
  const snap=await getDoc(doc(db,"agents",user.uid));
  if(!snap.exists() || snap.data().status!=="approved"){
   message.textContent="Agent Approval अभी नहीं मिला है।";
   await signOut(auth);
   return;
  }
  currentAgent={uid:user.uid,...snap.data()};
  loginBox.style.display="none";
  dashboard.style.display="block";
  document.getElementById("welcome").textContent="Welcome "+(currentAgent.name||"Agent");
  document.getElementById("agentMobile").textContent=currentAgent.mobile||"-";
  await loadLeads();
 }catch(e){
  message.textContent="Error: "+e.message;
 }
}

document.getElementById("loginBtn").onclick=async()=>{
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 message.textContent="Please wait...";
 try{
  const result=await signInWithEmailAndPassword(auth,email,password);
  await openDashboard(result.user);
 }catch(e){
  message.textContent="Login Error: "+e.message;
 }
};

onAuthStateChanged(auth,user=>{
 if(user) openDashboard(user);
});

document.getElementById("addLeadBtn").onclick=async()=>{
 const name=document.getElementById("customerName").value.trim();
 const mobile=document.getElementById("customerMobile").value.trim();
 const loanType=document.getElementById("loanType").value;
 const amount=Number(document.getElementById("loanAmount").value);
 const out=document.getElementById("leadMessage");

 if(!currentAgent){out.textContent="पहले Agent Login करें";return;}
 if(!name || !/^[0-9]{10}$/.test(mobile) || !loanType || !Number.isFinite(amount) || amount<=0){
  out.textContent="सभी जानकारी सही भरें। मोबाइल 10 अंक का होना चाहिए।";
  return;
 }

 out.textContent="Lead जमा हो रही है...";
 try{
  await addDoc(collection(db,"leads"),{
   agentUid:currentAgent.uid,
   customerName:name,
   mobile:mobile,
<input id="customerAddress" placeholder="Customer Full Address">
<input id="customerDistrict" placeholder="Customer District">
<input id="customerPin" placeholder="PIN Code" maxlength="6">
  
   loanType:loanType,
   loanAmount:amount,
   status:"pending",
   createdAt:serverTimestamp()
  });
  out.textContent="Customer Lead सफलतापूर्वक जमा हो गई!";
  document.getElementById("customerName").value="";
  document.getElementById("customerMobile").value="";
  document.getElementById("loanType").value="";
  document.getElementById("loanAmount").value="";
  await loadLeads();
 }catch(e){
  out.textContent="Lead Error: "+e.message;
 }
};

async function loadLeads(){
 if(!currentAgent)return;
 const area=document.getElementById("myLeads");
 area.textContent="Loading...";
 try{
  const q=query(collection(db,"leads"),where("agentUid","==",currentAgent.uid));
  const result=await getDocs(q);
  area.innerHTML="";
  if(result.empty){area.textContent="अभी कोई Customer Lead नहीं है।";return;}
  result.forEach(item=>{
   const d=item.data();
   const card=document.createElement("div");
   card.className="lead";
   const title=document.createElement("b");
   title.textContent=d.customerName||"-";
   const details=document.createElement("p");
   details.textContent="Mobile: "+(d.mobile||"-")+
    " | Loan: "+(d.loanType||"-")+
    " | Amount: ₹"+(d.loanAmount||0)+
    " | Status: "+(d.status||"pending");
   card.append(title,details);
   area.appendChild(card);
  });
 }catch(e){
  area.textContent="Leads Error: "+e.message;
 }
}

document.getElementById("refreshBtn").onclick=loadLeads;

document.getElementById("logoutBtn").onclick=async()=>{
 await signOut(auth);
 currentAgent=null;
 dashboard.style.display="none";
 loginBox.style.display="block";
 message.textContent="Logout हो गया।";
};
</script>
</body>
</html>
