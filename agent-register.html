<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Registration - Money Solution Finance</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#eef3ff;font-family:Arial,sans-serif;color:#172033}.box{max-width:560px;margin:18px auto;background:#fff;padding:22px;border-radius:16px;box-shadow:0 4px 18px #0002}h2{text-align:center;color:#123c83}p{line-height:1.5}.hint{font-size:13px;color:#596579}input,textarea,button{width:100%;padding:12px;margin:7px 0;border:1px solid #bbc7d8;border-radius:8px;font-size:16px}button{background:#0878d1;color:#fff;border:0;font-weight:bold}label{display:block;margin:10px 0}a{color:#0759a5}</style></head><body><main class="box"><h2>Money Solution Finance Services</h2><p style="text-align:center">Referral Agent Registration</p><p class="hint">आप Money Solution Finance के Referral Agent के रूप में ग्राहक की Inquiry भेजेंगे। आप किसी बैंक/NBFC के कर्मचारी या अधिकृत प्रतिनिधि नहीं बनते।</p><form id="agentForm"><input id="name" placeholder="पूरा नाम" maxlength="80" required><input id="father" placeholder="पिता का नाम" maxlength="80" required><textarea id="address" placeholder="पूरा पता" maxlength="250" required></textarea><input id="city" placeholder="शहर" maxlength="80" required><input id="district" placeholder="जिला" maxlength="80" required><input id="pin" placeholder="6 अंकों का PIN Code" inputmode="numeric" maxlength="6" required><input id="mobile" placeholder="10 अंकों का मोबाइल नंबर" inputmode="numeric" maxlength="10" required><input id="whatsapp" placeholder="WhatsApp नंबर" inputmode="numeric" maxlength="10" required><input id="email" type="email" placeholder="Email ID" required><input id="password" type="password" placeholder="Password (कम से कम 6 अक्षर)" minlength="6" required><input id="confirmPassword" type="password" placeholder="Password दोबारा लिखें" required><label><input type="checkbox" id="consent" required style="width:auto"> मैं सहमत हूँ कि मेरी जानकारी एजेंट रजिस्ट्रेशन के लिए उपयोग की जाए और मैं केवल Referral Agent के रूप में काम करूँगा।</label><button id="submitBtn">Registration करें</button></form><p id="message" role="status"></p><p style="text-align:center"><a href="agent-login.html">पहले से Agent हैं? Login करें</a> · <a href="index.html">Home</a></p></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,createUserWithEmailAndPassword}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{getFirestore,doc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';import{firebaseConfig}from'./firebase-config-module.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const form=document.getElementById('agentForm'),msg=document.getElementById('message'),btn=document.getElementById('submitBtn');form.addEventListener('submit',async e=>{e.preventDefault();const v=id=>document.getElementById(id).value.trim(),mobile=v('mobile'),whatsapp=v('whatsapp'),pin=v('pin'),email=v('email').toLowerCase(),password=v('password');if(password!==v('confirmPassword')){msg.textContent='दोनों Password एक जैसे नहीं हैं।';return}if(!/^\d{10}$/.test(mobile)||!/^\d{10}$/.test(whatsapp)||!/^\d{6}$/.test(pin)){msg.textContent='मोबाइल/WhatsApp के 10 और PIN के 6 अंक भरें।';return}btn.disabled=true;msg.textContent='Registration हो रहा है...';try{const cred=await createUserWithEmailAndPassword(auth,email,password),uid=cred.user.uid;await setDoc(doc(db,'agents',uid),{uid,name:v('name'),fatherName:v('father'),address:v('address'),city:v('city'),district:v('district'),pin,mobile,whatsapp,email,status:'pending',memberType:'referral_agent',createdAt:serverTimestamp()});msg.textContent='Registration सफल। Admin Approval के बाद आप Login करके अपनी Leads भेज सकेंगे।';form.reset()}catch(err){msg.textContent='समस्या: '+err.message}finally{btn.disabled=false}});</script></body></html>
