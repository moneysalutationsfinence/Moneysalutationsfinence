
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA Login - Money Solution Finance Services</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f1f4f9;font-family:Arial,sans-serif}
.container{max-width:430px;margin:50px auto;background:white;padding:25px;border-radius:14px;box-shadow:0 4px 18px #0002}
h2{text-align:center;color:#123d72}
p{text-align:center;color:#555}
input{width:100%;padding:14px;margin:10px 0;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{width:100%;padding:14px;background:#123d72;color:white;border:0;border-radius:7px;font-size:17px;margin-top:12px}
#message{text-align:center;margin-top:15px;font-weight:bold}
a{color:#123d72}
</style>
</head>
<body>
<div class="container">
<h2>Money Solution Finance Services</h2>
<p>DSA Login</p>
<form id="loginForm">
<input id="email" type="email" placeholder="Registered Email" required>
<input id="password" type="password" placeholder="Password" required>
<button id="loginBtn" type="submit">DSA Login करें</button>
</form>
<div id="message"></div>
<p><a href="dsa-register.html">नया DSA Registration करें</a></p>
<p><a href="index.html">होम पेज पर जाएँ</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey:"AIzaSyClTK1ZFegP_VMs0CO2n2ccyv5oWPqb2xo",
 authDomain:"money-salutations-fainence.firebaseapp.com",
 projectId:"money-salutations-fainence",
 storageBucket:"money-salutations-fainence.firebasestorage.app",
 messagingSenderId:"891890606664",
 appId:"1:891890606664:web:1d6df6ec8554d523176e7d",
 measurementId:"G-HX6NBT529M"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

document.getElementById("loginForm").addEventListener("submit",async(e)=>{
 e.preventDefault();
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const message=document.getElementById("message");
 const btn=document.getElementById("loginBtn");

 btn.disabled=true;
 message.style.color="#123d72";
 message.textContent="Login जाँच हो रहा है...";

 try{
   const result=await signInWithEmailAndPassword(auth,email,password);
   const snap=await getDoc(doc(db,"dsas",result.user.uid));

   if(!snap.exists()){
     await signOut(auth);
     throw new Error("DSA प्रोफाइल नहीं मिली।");
   }

   if(snap.data().status!=="approved"){
     await signOut(auth);
     throw new Error("आपका DSA Registration अभी Admin Approval के लिए Pending है।");
   }

   window.location.href="dsa-dashboard.html";

 }catch(error){
   message.style.color="red";
   message.textContent=error.message;
 }finally{
   btn.disabled=false;
 }
});
</script>
</body>
</html>
