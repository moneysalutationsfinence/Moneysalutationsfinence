
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Approval - Money Solution Finance</title>
<style>
body{font-family:Arial;background:#edf2f8;margin:0;padding:15px}
.container{max-width:750px;margin:auto}
.card{background:white;padding:18px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #ccc}
h2{color:#123c83;text-align:center}
input{width:100%;padding:12px;margin:8px 0;box-sizing:border-box;border:1px solid #aaa;border-radius:6px}
button{padding:11px 16px;border:0;border-radius:6px;color:white;background:#123c83;margin:5px;cursor:pointer}
.reject{background:#c62828}
.approve{background:#168447}
#message{font-weight:bold;text-align:center}
.status{font-weight:bold;color:#c07800}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h2>Money Solution Finance Services</h2>
<h3>Admin Agent Approval Panel</h3>

<div id="loginBox">
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Admin Password">
<button id="loginBtn">Admin Login</button>
</div>

<div id="dashboard" class="hidden">
<p id="welcome"></p>
<button id="refreshBtn">Refresh Agents</button>
<button id="logoutBtn">Logout</button>
<h3>Agent Applications</h3>
<div id="agentList">Loading...</div>
</div>
<p id="message"></p>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
 getFirestore, collection, getDocs, doc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyClTK1ZFegP_VMs0CO2n2ccyv5oWPqb2xo",
 authDomain: "money-salutations-fainence.firebaseapp.com",
 projectId: "money-salutations-fainence",
 storageBucket: "money-salutations-fainence.firebasestorage.app",
 messagingSenderId: "891890606664",
 appId: "1:891890606664:web:1d6df6ec8554d523176e7d",
 measurementId: "G-HX6NBT529M"
};

const ADMIN_UID = "mxqMPdrbN2Nmmqe6YWU3GYJM5GB3";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");
const message = document.getElementById("message");
const agentList = document.getElementById("agentList");

function showMessage(text) {
 message.textContent = text;
}

function showDashboard(user) {
 loginBox.classList.add("hidden");
 dashboard.classList.remove("hidden");
 document.getElementById("welcome").textContent = "Admin Login Successful";
 loadAgents();
}

onAuthStateChanged(auth, user => {
 if (user && user.uid === ADMIN_UID) {
   showDashboard(user);
 } else {
   dashboard.classList.add("hidden");
   loginBox.classList.remove("hidden");
 }
});

document.getElementById("loginBtn").addEventListener("click", async () => {
 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;
 if (!email || !password) {
   showMessage("Email aur password bhariye.");
   return;
 }
 try {
   const result = await signInWithEmailAndPassword(auth, email, password);
   if (result.user.uid !== ADMIN_UID) {
     await signOut(auth);
     showMessage("Access denied. Only Admin can login.");
     return;
   }
   showMessage("");
 } catch (error) {
   showMessage("Login Error: " + error.message);
 }
});

async function loadAgents() {
 agentList.textContent = "Loading agents...";
 try {
   const snapshot = await getDocs(collection(db, "agents"));
   agentList.replaceChildren();

   if (snapshot.empty) {
     agentList.textContent = "Abhi koi agent registration nahi hai.";
     return;
   }

   snapshot.forEach(agentDoc => {
     const a = agentDoc.data();
     const card = document.createElement("div");
     card.className = "card";

     const title = document.createElement("h3");
     title.textContent = a.name || "Name not available";

     const status = document.createElement("p");
     status.className = "status";
     status.textContent = "Status: " + (a.status || "unknown");

     const details = document.createElement("p");
     details.textContent =
       "Father: " + (a.fatherName || "") +
       "\nAddress: " + (a.address || "") +
       "\nCity: " + (a.city || "") +
       "\nDistrict: " + (a.district || "") +
       "\nPIN: " + (a.pin || "") +
       "\nMobile: " + (a.mobile || "") +
       "\nWhatsApp: " + (a.whatsapp || "") +
       "\nEmail: " + (a.email || "");
     details.style.whiteSpace = "pre-line";

     card.append(title, status, details);

     const approve = document.createElement("button");
     approve.className = "approve";
     approve.textContent = "Approve";
     approve.addEventListener("click", () =>
       changeStatus(agentDoc.id, "approved")
     );

     const reject = document.createElement("button");
     reject.className = "reject";
     reject.textContent = "Reject";
     reject.addEventListener("click", () =>
       changeStatus(agentDoc.id, "rejected")
     );

     card.append(approve, reject);
     agentList.append(card);
   });
 } catch (error) {
   agentList.textContent = "Error: " + error.message;
 }
}

async function changeStatus(id, status) {
 if (!auth.currentUser || auth.currentUser.uid !== ADMIN_UID) {
   showMessage("Admin login required.");
   return;
 }
 try {
   await updateDoc(doc(db, "agents", id), {status: status});
   showMessage("Agent status updated: " + status);
   loadAgents();
 } catch (error) {
   showMessage("Update Error: " + error.message);
 }
}

document.getElementById("refreshBtn").addEventListener("click", loadAgents);

document.getElementById("logoutBtn").addEventListener("click", async () => {
 await signOut(auth);
 showMessage("Logged out.");
});
</script>
</body>
</html>
