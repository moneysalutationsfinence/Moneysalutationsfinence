function makeAgentPrefix(name){
const words=String(name||"").trim().toUpperCase().split(/\s+/).filter(Boolean);
let prefix=words.length>=2?words[0].charAt(0)+words[1].charAt(0):words[0]?.replace(/[^A-Z]/g,"").slice(0,2);
prefix=(prefix||"").replace(/[^A-Z]/g,"");
return prefix.length===2?prefix:"MS";
}

async function issueAgentId(id,status="approved"){
const agentRef=db.collection("agents").doc(id);
const counterRef=db.collection("counters").doc("agentSerial");
return await db.runTransaction(async transaction=>{
const agentSnap=await transaction.get(agentRef);
if(!agentSnap.exists)throw new Error("Agent Profile नहीं मिला।");
const agent=agentSnap.data();
if(status==="approved"&&agent.agentId){
transaction.update(agentRef,{status:"approved",updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
return agent.agentId;
}
if(status!=="approved"){
transaction.update(agentRef,{status:status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
return null;
}
const counterSnap=await transaction.get(counterRef);
const lastNumber=counterSnap.exists?Number(counterSnap.data().lastNumber||0):0;
const nextNumber=lastNumber+1;
const agentId=makeAgentPrefix(agent.name)+"-"+String(nextNumber).padStart(3,"0");
transaction.set(counterRef,{lastNumber:nextNumber,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
transaction.update(agentRef,{agentId:agentId,status:"approved",updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
return agentId;
});
}

const url=$("partnerUrl").value.trim();
let parsed;
try{parsed=new URL(url);}catch(e){$("partnerMsg").textContent="सही URL लिखें।";return;}
if(parsed.protocol!=="https:"){
$("partnerMsg").textContent="सुरक्षा के लिए HTTPS लिंक ही स्वीकार होगा।";return;
}
const data={
name,category,url,
enabled:$("partnerEnabled").checked,
updatedAt:firebase.firestore.FieldValue.serverTimestamp()
};
try{
if(id){
await db.collection("partnerLinks").doc(id).update(data);
}else{
data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
await db.collection("partnerLinks").add(data);
}
$("partnerForm").reset();
$("partnerId").value="";
$("partnerEnabled").checked=true;
$("partnerSave").textContent="Partner Link Save करें";
$("partnerMsg").textContent="Partner Link सफलतापूर्वक Save हो गया।";
await loadPartners();
}catch(err){$("partnerMsg").textContent="Save नहीं हुआ: "+err.message;}
};

async function togglePartner(p){
try{
await db.collection("partnerLinks").doc(p.id).update({
enabled:!p.enabled,
updatedAt:firebase.firestore.FieldValue.serverTimestamp()
});
await loadPartners();
}catch(e){alert("बदलाव नहीं हुआ: "+e.message);}
}

async function deletePartner(id){
if(!confirm("यह Partner Link Delete करना चाहते हैं?"))return;
try{
await db.collection("partnerLinks").doc(id).delete();
await loadPartners();
}catch(e){alert("Delete नहीं हुआ: "+e.message);}
}
</script>
