
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Loan Tracking</title>
<style>
body{font-family:Arial;background:#eef2ff;margin:0;padding:20px}
.box{max-width:450px;margin:35px auto;background:white;padding:22px;border-radius:15px;box-shadow:0 3px 15px #ccc}
h2{text-align:center;color:#173b80}
input,button{width:100%;padding:13px;margin:10px 0;box-sizing:border-box;border-radius:8px}
input{border:1px solid #aaa}
button{background:#1746a2;color:white;border:0;font-size:16px}
#result{margin-top:15px;line-height:1.8}
</style>
</head>
<body>
<div class="box">
<h2>Money Solution Finance Services</h2>
<h3>Loan Application Tracking</h3>
<p>अपना Tracking ID दर्ज करें।</p>
<input id="trackingId" placeholder="Tracking ID">
<button onclick="trackLoan()">Check Application Status</button>
<div id="result"></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyClTK1ZFegP_VMs0CO2n2ccyv5oWPqb2xo",
 authDomain: "money-salutations-fainence.firebaseapp.com",
 projectId: "money-salutations-fainence",
 storageBucket: "money-salutations-fainence.firebasestorage.app",
 messagingSenderId: "891890606664",
 appId: "1:891890606664:web:1d6df6ec8554d523176e7d",
 measurementId: "G-HX6NBT529M"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

window.trackLoan=async function(){
 const id=document.getElementById("trackingId").value.trim();
 const result=document.getElementById("result");
 if(!id){result.innerHTML="कृपया Tracking ID दर्ज करें।";return;}
 result.innerHTML="जाँच हो रही है...";
 try{
  const snap=await getDoc(doc(db,"tracking",id));
  if(!snap.exists()){
   result.innerHTML="Tracking ID नहीं मिली।";
   return;
  }
  const d=snap.data();
  result.innerHTML="<b>आवेदन की स्थिति:</b> "+String(d.status||"Pending")+
  "<br><b>Loan Type:</b> "+String(d.loanType||"-");
 }catch(e){
  result.innerHTML="जानकारी प्राप्त नहीं हो सकी। कृपया बाद में प्रयास करें।";
 }
}
</script>
</body>
</html>
