
<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Login - Money Solution Finance</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#eef3ff;font-family:Arial,sans-serif;color:#172033}
.box{max-width:760px;margin:18px auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 4px 18px #0002}
h2,h3{color:#123c83}
input,textarea,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #bbc7d8;border-radius:8px;font-size:16px}
button{background:#0878d1;color:#fff;border:0;font-weight:bold}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{background:#f1f5fb;padding:12px;border-radius:10px;margin:10px 0;overflow-wrap:anywhere}
.small{font-size:13px;color:#596579}
@media(max-width:560px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="box">
<h2>Money Solution Finance Services</h2>

<section id="loginBox">
<h3>Agent / DSA Login</h3>
<input id="email" type="email" placeholder="Email ID">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="loginMsg" role="status"></p>
<p><a href="agent-register.html">नया Agent / DSA Registration</a></p>
</section>

<section id="appBox" hidden>
<p id="welcome"></p>
<p id="statusText"></p>
<button id="logoutBtn">Logout</button>

<section id="leadArea" hidden>
<h3>नई Customer Lead भेजें</h3>
<form id="leadForm">
<input id="customerName" placeholder="ग्राहक का पूरा नाम" maxlength="80" required>
<input id="mobile" placeholder="ग्राहक का 10 अंकों का मोबाइल" inputmode="numeric" maxlength="10" required>
<textarea id="address" placeholder="ग्राहक का पता" maxlength="250" required></textarea>
<div class="row">
<input id="district" placeholder="जिला" required>
<input id="pin" placeholder="6 अंकों का PIN" inputmode="numeric" maxlength="6" required>
</div>
<select id="loanType" required>
<option value="">लोन की जरूरत चुनें</option>
<option>Personal Loan</option>
<option>Business Loan</option>
<option>Home Loan</option>
<option>Loan Against Property</option>
<option>Vehicle Loan</option>
<option>MSME Finance</option>
<option>Other</option>
</select>
<input id="loanAmount" type="number" min="0" placeholder="अनुमानित Loan Amount (₹)">
<label class="small">
<input id="customerConsent" type="checkbox" required style="width:auto">
ग्राहक ने अपनी जानकारी Money Solution Finance को भेजने की सहमति दी है।
</label>
<button id="sendLeadBtn" type="submit">Customer Lead भेजें</button>
</form>

<p id="leadMsg" role="status"></p>
<h3>मेरी भेजी हुई Customer Leads</h3>
<button id="refreshBtn" type="button">Leads Refresh करें</button>
<div id="myLeads"></div>
</section>
</section>

<p class="small">Agent केवल Referral Lead भेजता है। Loan approval संबंधित बैंक/NBFC के निर्णय पर निर्भर है।</p>
<p><a href="index.html">Home</a></p>
</main>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{getFirestore,doc,getDoc,collection,addDoc,query,where,getDocs,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import{firebaseConfig}from'./firebase-config-module.js';

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
let current=null;
const $=id=>document.getElementById(id);

$('loginBtn').onclick=async()=>{
$('loginMsg').textContent='Login हो रहा है...';
try{
await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);
}catch(e){
$('loginMsg').textContent='Login असफल: '+e.message;
}
};

$('logoutBtn').onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
if(!user){
current=null;
$('loginBox').hidden=false;
$('appBox').hidden=true;
return;
}

try{
const snap=await getDoc(doc(db,'agents',user.uid));

if(!snap.exists()){
await signOut(auth);
$('loginMsg').textContent='Agent Profile नहीं मिला।';
return;
}

current={uid:user.uid,...snap.data()};

$('loginBox').hidden=true;
$('appBox').hidden=false;

// छोटी Agent ID दिखाएँ, Firebase UID नहीं
$('welcome').textContent='स्वागत है, '+(current.name||'Agent')+' | Agent ID: '+(current.agentId||'Admin Approval के बाद मिलेगा');

$('statusText').textContent='Approval Status: '+(current.status||'pending');
$('leadArea').hidden=current.status!=='approved';

if(current.status==='approved')loadLeads();

}catch(e){
$('statusText').textContent='Profile Error: '+e.message;
}
});

$('leadForm').addEventListener('submit',async e=>{
e.preventDefault();
if(!current||current.status!=='approved')return;

const mobile=$('mobile').value.trim();
const pin=$('pin').value.trim();

if(!/^\d{10}$/.test(mobile)||!/^\d{6}$/.test(pin)){
$('leadMsg').textContent='सही मोबाइल और PIN भरें।';
return;
}

$('sendLeadBtn').disabled=true;

try{
await addDoc(collection(db,'leads'),{
agentUid:current.uid,
agentName:current.name||'',
agentMobile:current.mobile||'',
customerName:$('customerName').value.trim(),
mobile,
address:$('address').value.trim(),
district:$('district').value.trim(),
pin,
loanType:$('loanType').value,
loanAmount:$('loanAmount').value.trim(),
customerConsent:true,
status:'pending',
createdAt:serverTimestamp()
});

$('leadMsg').textContent='Lead सफलतापूर्वक भेज दी गई।';
$('leadForm').reset();
loadLeads();

}catch(e){
$('leadMsg').textContent='Lead नहीं भेजी गई: '+e.message;
}finally{
$('sendLeadBtn').disabled=false;
}
});

$('refreshBtn').onclick=loadLeads;

async function loadLeads(){
if(!current)return;

$('myLeads').textContent='Loading...';

try{
const q=query(collection(db,'leads'),where('agentUid','==',current.uid));
const snap=await getDocs(q);
const rows=[];

snap.forEach(d=>rows.push({id:d.id,...d.data()}));

rows.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));

$('myLeads').innerHTML='';

if(!rows.length){
$('myLeads').textContent='अभी कोई Lead नहीं है।';
return;
}

rows.forEach(d=>{
const el=document.createElement('div');
el.className='item';

const p=document.createElement('p');
p.style.whiteSpace='pre-wrap';
p.textContent=
'ग्राहक: '+(d.customerName||'-')+
'\nमोबाइल: '+(d.mobile||'-')+
'\nसेवा: '+(d.loanType||'-')+
'\nजिला: '+(d.district||'-')+
'\nराशि: '+(d.loanAmount||'-')+
'\nस्थिति: '+(d.status||'New');

el.appendChild(p);
$('myLeads').appendChild(el);
});

}catch(e){
$('myLeads').textContent='Leads Error: '+e.message;
}
}
</script>
</body>
</html>
