
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Solution Finance - Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#eef3f9;font-family:Arial;color:#172033}
.wrap{max-width:1100px;margin:18px auto}
.panel{background:white;padding:18px;border-radius:14px;box-shadow:0 3px 14px #0001;margin-bottom:14px}
h1,h2{color:#123b70;margin-top:0}
.login{max-width:430px;margin:7vh auto}
input,select,textarea,button{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:8px;width:100%;margin:5px 0}
button{background:#123b70;color:white;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.danger{background:#b42318}
.secondary{background:#475569}
.green{background:#168044}
.orange{background:#b76b08}
.tabs,.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tools{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.item{border:1px solid #dbe3ed;border-radius:11px;padding:14px;margin:12px 0;background:#fbfdff;overflow-wrap:anywhere}
.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px}
.details p{margin:4px 0;line-height:1.45}
.muted{color:#64748b;font-size:13px}
#dashboard{display:none}
.error{color:#b42318}
.success{color:#168044}
dialog{border:0;border-radius:12px;max-width:560px;width:calc(100% - 24px);box-shadow:0 10px 40px #0004}
dialog::backdrop{background:#0007}
#agentsSection{display:none}
@media(max-width:650px){
.tabs,.actions,.tools,.details{grid-template-columns:1fr}
.panel{padding:13px}
.wrap{margin:5px auto}
}
</style>
</head>
<body>
<div class="wrap">

<section class="panel login" id="loginBox">
<h2>Money Solution Finance</h2>
<h3>Admin Login</h3>
<form id="loginForm">
<input id="email" type="email" placeholder="Admin Email" required>
<input id="password" type="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p id="loginMsg" class="error"></p>
</section>

<section id="dashboard">
<div class="panel">
<h1>Admin Dashboard</h1>
<div class="tabs">
<button id="inquiryTab">Customer Inquiries</button>
<button id="agentTab">Agent Management</button>
<button class="danger" id="logoutBtn">Logout</button>
</div>
</div>

<div class="panel" id="inquirySection">
<h2>Customer Inquiries</h2>
<button class="secondary" id="refreshBtn">Refresh Inquiries</button>
<div class="tools">
<input id="search" placeholder="नाम, मोबाइल, जिला या सेवा खोजें">
<select id="statusFilter">
<option value="">सभी Status</option>
<option>New</option>
<option>Contacted</option>
<option>Follow-up</option>
<option>Closed</option>
</select>
</div>
<p id="count" class="muted"></p>
<p id="listMsg" class="muted"></p>
<div id="list"></div>
</div>

<div class="panel" id="agentsSection">
<h2>Registered Agents</h2>
<button class="secondary" id="refreshAgents">Refresh Agents</button>
<div class="tools">
<input id="agentSearch" placeholder="Agent ID, नाम, मोबाइल, Email या जिला खोजें">
<select id="agentStatus">
<option value="">सभी Agents</option>
<option value="pending">Pending</option>
<option value="approved">Approved</option>
<option value="rejected">Rejected</option>
</select>
</div>
<p id="agentCount" class="muted"></p>
<p id="agentMsg" class="muted"></p>
<div id="agentList"></div>
</div>
</section>
</div>

<dialog id="agentDialog">
<form id="agentForm">
<h2>Agent Details Edit</h2>
<input type="hidden" id="aUid">
<label>नाम<input id="aName" required></label>
<label>पिता का नाम<input id="aFather"></label>
<label>पता<textarea id="aAddress"></textarea></label>
<label>शहर<input id="aCity"></label>
<label>जिला<input id="aDistrict"></label>
<label>PIN<input id="aPin" maxlength="6"></label>
<label>मोबाइल<input id="aMobile" maxlength="10"></label>
<label>WhatsApp<input id="aWhatsapp" maxlength="10"></label>
<div class="actions">
<button type="submit">Save Changes</button>
<button type="button" class="secondary" id="closeAgentDialog">Cancel</button>
</div>
<p id="agentEditMsg" class="error"></p>
</form>
</dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig={
apiKey:"AIzaSyClTK1ZFegP_VMs0CO2n2ccyv5oWPqb2xo",
authDomain:"money-salutations-fainence.firebaseapp.com",
projectId:"money-salutations-fainence",
storageBucket:"money-salutations-fainence.firebasestorage.app",
messagingSenderId:"891890606664",
appId:"1:891890606664:web:1d6df6ec8554d523176e7d",
measurementId:"G-HX6NBT529M"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const ADMIN_UID="mxqMPdrbN2Nmmqe6YWU3GYJM5GB3";
const $=id=>document.getElementById(id);
let records=[],agents=[];

$("loginForm").onsubmit=async e=>{
e.preventDefault();
$("loginMsg").textContent="Login हो रहा है...";
try{
await auth.signInWithEmailAndPassword(
$("email").value.trim(),
$("password").value
);
}catch(err){
$("loginMsg").textContent="Login नहीं हुआ: "+err.message;
}
};

auth.onAuthStateChanged(async user=>{
if(user&&user.uid===ADMIN_UID){
$("loginBox").style.display="none";
$("dashboard").style.display="block";
await loadData();
await loadAgents();
}else{
$("dashboard").style.display="none";
$("loginBox").style.display="block";
if(user){
await auth.signOut();
$("loginMsg").textContent="यह Account Admin नहीं है।";
}
}
});

$("logoutBtn").onclick=()=>auth.signOut();

$("inquiryTab").onclick=()=>{
$("inquirySection").style.display="block";
$("agentsSection").style.display="none";
};

$("agentTab").onclick=()=>{
$("inquirySection").style.display="none";
$("agentsSection").style.display="block";
loadAgents();
};

$("refreshBtn").onclick=loadData;
$("refreshAgents").onclick=loadAgents;
$("search").oninput=renderInquiries;
$("statusFilter").onchange=renderInquiries;
$("agentSearch").oninput=renderAgents;
$("agentStatus").onchange=renderAgents;

function dateText(v){
if(!v)return "-";
return v.toDate?v.toDate().toLocaleString("en-IN"):String(v);
}

async function loadData(){
$("listMsg").textContent="Inquiries लोड हो रही हैं...";
try{
const snap=await db.collection("inquiries").get();
records=snap.docs.map(x=>({id:x.id,...x.data()}));
records.sort((a,b)=>
(b.createdAt?.toMillis?.()||0)-
(a.createdAt?.toMillis?.()||0)
);
$("listMsg").textContent="";
renderInquiries();
}catch(e){
$("listMsg").textContent="डेटा नहीं खुला: "+e.message;
}
}

function renderInquiries(){
const q=$("search").value.trim().toLowerCase();
const st=$("statusFilter").value;
const arr=records.filter(d=>{
const s=[
d.name,d.fullName,d.phone,d.mobile,d.address,d.district,
d.pin,d.service,d.loanType,d.message
].join(" ").toLowerCase();
return (!q||s.includes(q))&&(!st||(d.status||"New")===st);
});

$("count").textContent="कुल "+arr.length+" Inquiry";
$("list").innerHTML="";

if(!arr.length){
$("list").textContent="कोई Inquiry नहीं मिली।";
return;
}

arr.forEach(d=>{
const card=document.createElement("article");
card.className="item";

const h=document.createElement("h3");
h.textContent=(d.name||d.fullName||"Customer")+" — "+(d.phone||d.mobile||"-");

const info=document.createElement("div");
info.className="details";

[
["सेवा",d.service||d.loanType],
["Loan Amount",d.loanAmount||d.amount],
["पता",d.address],
["जिला",d.district],
["PIN",d.pin],
["Message",d.message],
["Date",dateText(d.createdAt)],
["Status",d.status||"New"],
["Follow-up",d.followUpDate]
].forEach(([k,v])=>{
const p=document.createElement("p");
p.textContent=k+": "+(v||"-");
info.append(p);
});

const del=document.createElement("button");
del.className="danger";
del.textContent="Delete Inquiry";
del.onclick=async()=>{
if(confirm("Inquiry Delete करें?")){
try{
await db.collection("inquiries").doc(d.id).delete();
await loadData();
}catch(e){alert(e.message);}
}
};

card.append(h,info,del);
$("list").append(card);
});
}

async function loadAgents(){
$("agentMsg").textContent="Agents लोड हो रहे हैं...";
try{
const snap=await db.collection("agents").get();
agents=snap.docs.map(x=>({id:x.id,...x.data()}));
agents.sort((a,b)=>
(b.createdAt?.toMillis?.()||0)-
(a.createdAt?.toMillis?.()||0)
);
$("agentMsg").textContent="";
renderAgents();
}catch(e){
$("agentMsg").textContent="Agents नहीं खुले: "+e.message;
}
}

/* नाम से Agent ID का शुरुआती अक्षर */
function makeAgentPrefix(name){
const words=String(name||"")
.trim()
.toUpperCase()
.split(/\s+/)
.filter(Boolean);

let prefix="";

if(words.length>=2){
prefix=words[0].charAt(0)+words[1].charAt(0);
}else if(words.length===1){
prefix=words[0].replace(/[^A-Z]/g,"").slice(0,2);
}

prefix=prefix.replace(/[^A-Z]/g,"");
return prefix.length===2?prefix:"MS";
}

/* Transaction से क्रमवार और यूनिक Agent ID */
async function issueAgentId(id,status="approved"){
const agentRef=db.collection("agents").doc(id);
const counterRef=db.collection("counters").doc("agentSerial");

return await db.runTransaction(async transaction=>{
const agentSnap=await transaction.get(agentRef);

if(!agentSnap.exists){
throw new Error("Agent Profile नहीं मिला।");
}

const agent=agentSnap.data();

if(status==="approved"&&agent.agentId){
transaction.update(agentRef,{
status:"approved",
updatedAt:firebase.firestore.FieldValue.serverTimestamp()
});
return agent.agentId;
}

if(status!=="approved"){
transaction.update(agentRef,{
status:status,
updatedAt:firebase.firestore.FieldValue.serverTimestamp()
});
return null;
}

const counterSnap=await transaction.get(counterRef);
const lastNumber=counterSnap.exists?
Number(counterSnap.data().lastNumber||0):0;

const nextNumber=lastNumber+1;
const serial=String(nextNumber).padStart(3,"0");
const agentId=makeAgentPrefix(agent.name)+"-"+serial;

transaction.set(counterRef,{
lastNumber:nextNumber,
updatedAt:firebase.firestore.FieldValue.serverTimestamp()
},{merge:true});

transaction.update(agentRef,{
agentId:agentId,
status:"approved",
updatedAt:firebase.firestore.FieldValue.serverTimestamp()
});

return agentId;
});
}

function renderAgents(){
const q=$("agentSearch").value.trim().toLowerCase();
const st=$("agentStatus").value;

const arr=agents.filter(a=>{
const s=[
a.agentId,a.name,a.mobile,a.email,a.district,a.city,a.uid
].join(" ").toLowerCase();

return (!q||s.includes(q))&&(!st||a.status===st);
});

$("agentCount").textContent="कुल "+arr.length+" Agents";
$("agentList").innerHTML="";

if(!arr.length){
$("agentList").textContent="कोई Agent नहीं मिला।";
return;
}

arr.forEach(a=>{
const card=document.createElement("article");
card.className="item";

const h=document.createElement("h3");
h.textContent=(a.name||"Agent")+" ("+(a.status||"pending")+")";

const info=document.createElement("div");
info.className="details";

[
["Agent ID",a.agentId||"अभी जारी नहीं हुई"],
["पिता का नाम",a.fatherName],
["मोबाइल",a.mobile],
["WhatsApp",a.whatsapp],
["Email",a.email],
["पता",a.address],
["शहर",a.city],
["जिला",a.district],
["PIN",a.pin],
["Registration",dateText(a.createdAt)]
].forEach(([k,v])=>{
const p=document.createElement("p");
p.textContent=k+": "+(v||"-");
info.append(p);
});

const actions=document.createElement("div");
actions.className="actions";

const approve=document.createElement("button");
approve.className="green";
approve.textContent="Approve और ID जारी करें";
approve.onclick=()=>changeAgentStatus(a.id,"approved");

const reject=document.createElement("button");
reject.className="secondary";
reject.textContent="Reject";
reject.onclick=()=>changeAgentStatus(a.id,"rejected");

const edit=document.createElement("button");
edit.textContent="Edit";
edit.onclick=()=>openAgentEdit(a);

const del=document.createElement("button");
del.className="danger";
del.textContent="Delete Profile";
del.onclick=()=>deleteAgent(a.id);

actions.append(approve,reject,edit,del);

/* पुराने Approved एजेंट जिनकी ID नहीं है */
if(a.status==="approved"&&!a.agentId){
const issue=document.createElement("button");
issue.className="orange";
issue.textContent="Generate Agent ID";
issue.onclick=()=>changeAgentStatus(a.id,"approved");
actions.append(issue);
}

card.append(h,info,actions);
$("agentList").append(card);
});
}

async function changeAgentStatus(id,status){
const msg=status==="approved"?
"Agent को Approve करके नई Agent ID जारी करना चाहते हैं?":
"Agent Status "+status+" करना चाहते हैं?";

if(!confirm(msg))return;

try{
const agentId=await issueAgentId(id,status);
if(agentId){
alert("Agent Approved!\nAgent ID: "+agentId);
}
await loadAgents();
}catch(e){
alert("Status update नहीं हुआ: "+e.message);
}
}

function openAgentEdit(a){
$("aUid").value=a.id;
$("aName").value=a.name||"";
$("aFather").value=a.fatherName||"";
$("aAddress").value=a.address||"";
$("aCity").value=a.city||"";
$("aDistrict").value=a.district||"";
$("aPin").value=a.pin||"";
$("aMobile").value=a.mobile||"";
$("aWhatsapp").value=a.whatsapp||"";
$("agentEditMsg").textContent="";
$("agentDialog").showModal();
}

$("closeAgentDialog").onclick=()=>$("agentDialog").close();

$("agentForm").onsubmit=async e=>{
e.preventDefault();
const id=$("aUid").value;

try{
await db.collection("agents").doc(id).update({
name:$("aName").value.trim(),
fatherName:$("aFather").value.trim(),
address:$("aAddress").value.trim(),
city:$("aCity").value.trim(),
district:$("aDistrict").value.trim(),
pin:$("aPin").value.trim(),
mobile:$("aMobile").value.trim(),
whatsapp:$("aWhatsapp").value.trim(),
updatedAt:firebase.firestore.FieldValue.serverTimestamp()
});

$("agentDialog").close();
await loadAgents();
}catch(err){
$("agentEditMsg").textContent="Save नहीं हुआ: "+err.message;
}
};

async function deleteAgent(id){
if(!confirm("Agent Profile Firestore से Delete होगा। Authentication Account अपने आप Delete नहीं होगा। जारी रखें?"))return;

try{
await db.collection("agents").doc(id).delete();
await loadAgents();
}catch(e){
alert("Delete नहीं हुआ: "+e.message);
}
}
</script>
</body>
</html>
